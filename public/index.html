<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quote e PPG</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f7f4;--fg:#1d2320;--card:#fff;--mut:#66706b;--bd:#dfe3df;--ac:#0b6e4f;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101412;--fg:#e8ece9;--card:#171d1a;--mut:#93a09a;--bd:#27302b;--ac:#58c9a0;--on:#06241a}}
:root[data-theme="dark"]{--bg:#101412;--fg:#e8ece9;--card:#171d1a;--mut:#93a09a;--bd:#27302b;--ac:#58c9a0;--on:#06241a}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 12px 24px}
h1{font-size:1.25rem;margin:16px 0 4px}h2{font-size:1rem;margin:20px 0 8px;color:var(--ac)}h3{font-size:.95rem;margin:14px 0 4px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:.85rem;margin:2px 0}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;margin:8px 0}
input{width:100%;box-sizing:border-box;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.tabs{display:flex;gap:8px;margin:6px 0}.tabs button{flex:1;margin:0;background:var(--card);color:var(--fg);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
textarea{width:100%;height:90px;box-sizing:border-box;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
article{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.hd b{font-size:.95rem}.hd span{color:var(--mut);font-size:.8rem;white-space:nowrap}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.85rem}
th,td{text-align:left;padding:3px 4px;border-top:1px solid var(--bd)}th{color:var(--mut);font-weight:500}.ppg{color:var(--ac);font-weight:600}
</style></head><body>
<h1>Quote e PPG</h1>
<p class=sub id=st1></p><p class=sub id=st2></p>
<button id=ref>Aggiorna quote</button> <button id=paste>Incolla lista PPG</button>
<details id=det><summary class=sub>Indirizzo del server</summary><input id=srv placeholder="https://.../api/refresh"><button id=sv>Salva</button></details>
<div id=box hidden><textarea id=ta placeholder="Incolla qui la lista copiata da probettinghub"></textarea><button id=ok>Usa lista</button></div>
<div class=tabs id=tabs><button data-k=live id=tl>Live</button><button data-k=next id=tn>Prossimi</button></div>
<div id=out></div>
<script>
const SNAP={"updated":"","matches":[]};
const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('sv');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STOP=new Set(['fc','cf','sc','ac','afc','fk','cd','ud','de','the','club']);
const norm=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)).join(' ');
function sim(a,b){a=norm(a);b=norm(b);const m=a.length,n=b.length;if(!m||!n)return 0;let p=Array.from({length:n+1},(_,j)=>j);
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return 1-p[n]/Math.max(m,n)}
function find(m,L){let b=null,t=0;for(const p of L){const s=Math.min(sim(m.home,p.home),sim(m.away,p.away));if(s>t){b=p;t=s}}return t>=.8?b:null}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DATA=store.get('data')||SNAP,TAB=store.get('tab')||'live';
const cards=(y,r)=>(y?' 🟨'+y:'')+(r?' 🟥'+r:'');
const sp=d=>d?[esc(d.op)+' @ '+esc(d.qop),esc(d.cu)+' @ '+esc(d.qcu)]:['–','–'];
function card(m,p){const ho=sp(m.sh),ao=sp(m.sa),sc=m.hg!==''?' · '+esc(m.hg)+'-'+esc(m.ag):'',ht=m.ht&&m.ht!=='-'?' · 1T '+esc(m.ht):'';
 return `<article><div class=hd><b>${esc(m.home)}${cards(m.hy,m.hr)} – ${esc(m.away)}${cards(m.ay,m.ar)}</b><span>${esc(m.when)}${sc}${ht}</span></div>
<table><tr><th></th><th>Apertura</th><th>Chiusura</th></tr>
<tr><td>1 X 2</td><td>${esc((m.x_op||[]).join(' ')||'–')}</td><td>${esc((m.x_cu||[]).join(' ')||'–')}</td></tr>
<tr><td>Spread casa</td><td>${ho[0]}</td><td>${ho[1]}</td></tr><tr><td>Spread ospite</td><td>${ao[0]}</td><td>${ao[1]}</td></tr>
<tr><td>PPG</td><td colspan=2 class=ppg>${p?esc(p.ph)+' – '+esc(p.pa):'non trovato'}</td></tr></table></article>`}
function draw(){const sv=store.get('ppg'),L=sv?sv.matches:[];let hit=0,h='';const cnt=k=>DATA.matches.filter(m=>m.kind===k).length;
 $('tl').textContent='Live ('+cnt('live')+')';$('tn').textContent='Prossimi ('+cnt('next')+')';$('tl').className=TAB==='live'?'on':'';$('tn').className=TAB==='next'?'on':'';
 for(const [k,t] of [['live','Live'],['next','Prossimi match']].filter(x=>x[0]===TAB)){const ms=DATA.matches.filter(m=>m.kind===k);let last=null;h+=`<h2>${t} (${ms.length})</h2>`;
  for(const m of ms){if(m.league!==last){last=m.league;h+=`<h3>${esc(last)}</h3>`}const p=find(m,L);hit+=!!p;h+=card(m,p)}}
 $('out').innerHTML=h;
 $('st1').textContent=DATA.matches.length?'Quote: '+(DATA.updated||'esempio'):'Nessun dato: tocca "Aggiorna quote"';
 $('st2').textContent=sv?`PPG del ${sv.date}${sv.date!==today()?' (non di oggi: aggiorna la lista)':''} · abbinati ${hit} su ${cnt(TAB)}`:'Nessuna lista PPG: tocca "Incolla lista PPG"'}
function setList(txt){const d=JSON.parse(txt),ms=Array.isArray(d)?d:d.matches;if(!ms||!ms.length)throw 0;store.set('ppg',{date:today(),matches:ms});draw()}
$('paste').onclick=async()=>{try{setList(await navigator.clipboard.readText())}catch(e){$('box').hidden=false}};
$('ok').onclick=()=>{try{setList($('ta').value);$('box').hidden=true;$('ta').value=''}catch(e){alert('Lista non valida')}};
$('tabs').onclick=e=>{const k=e.target.dataset.k;if(k){TAB=k;store.set('tab',k);draw()}};
$('srv').value=store.get('srv')||'/api/refresh';
$('sv').onclick=()=>{store.set('srv',$('srv').value.trim());$('st1').textContent='Indirizzo salvato'};
$('ref').onclick=async()=>{const u=store.get('srv')||'/api/refresh';
 if(!u){$('det').open=true;$('st1').textContent='Imposta prima l\'indirizzo del server';return}
 $('ref').disabled=true;$('ref').textContent='Aggiorno…';
 try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!d.matches||!d.matches.length){draw();$('st1').textContent='Il server non ha trovato dati: '+JSON.stringify(d.errors||{});throw 0}
  d.updated='aggiornato alle '+new Date().toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit'});DATA=d;store.set('data',d);draw()}
 catch(e){if(!$('st1').textContent.startsWith('Il server'))$('st1').textContent='Aggiornamento non riuscito: riprova'}
 $('ref').disabled=false;$('ref').textContent='Aggiorna quote'};
async function fromHash(){const m=location.hash.match(/^#ppg=([gj])(.+)$/);if(!m)return;
 try{let b=m[2].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
  const txt=m[1]==='g'?await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(bytes);
  const ms=JSON.parse(txt).m.map(r=>({home:r[0],away:r[1],ph:r[2],pa:r[3]}));
  if(ms.length)store.set('ppg',{date:today(),matches:ms})}catch(e){}
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
fromHash().then(draw,draw);
</script></body></html>
